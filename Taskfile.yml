version: '3'

tasks:
  default:
    cmds:
      - task --list

  # === Core Pipeline Tasks ===

  fetch:c:
    desc: "[Offline] Load raw broker CSVs into interim (no unified, no network)"
    cmds:
      - uv run python -m src.cli fetch {{.CLI_ARGS}}

  fetch:m:
    desc: "[Network] Update resources with latest market data (forex + stock prices)"
    cmds:
      - uv run python -m src.cli fetch --download {{.CLI_ARGS}}

  run:
    desc: "Full pipeline: load raw → read resources → create unified → status"
    cmds:
      - task: fetch:c
      - uv run python -m src.cli metrics --compute {{.CLI_ARGS}}

  # === View Commands ===

  holdings:
    desc: "List current portfolio holdings (quantity, cost, value)"
    cmds:
      - uv run python -m src.cli holdings {{.CLI_ARGS}}

  metrics:
    desc: "Show performance metrics and asset allocation summary"
    cmds:
      - uv run python -m src.cli metrics {{.CLI_ARGS}}

  analyze:ff5:
    desc: "Run FF5 Alpha Verification (Offline). Required: --strategy-csv <path>"
    cmds:
      - uv run python -m src.analysis.ff5.main {{.CLI_ARGS}}

  # === Web & Reports ===

  serve:
    desc: "Start Web Dashboard"
    cmds:
      - uv run uvicorn src.webapp.main:app --reload --host 0.0.0.0 --port 8000

  report:
    desc: "Generate static report files (charts, html, json)"
    cmds:
      - uv run python -m src.cli report {{.CLI_ARGS}}

  # === Support Tasks ===

  clean:
    desc: "Delete generated data"
    cmds:
      - rm -rf data/interim data/unified data/reports data/processed data/output
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete

  format:
    desc: "Apply Ruff and Prettier formatting (modifies files)"
    cmds:
      - uvx ruff check . --fix
      - uvx ruff format .
      - npx -y prettier@3.9.6 --write "src/webapp/templates/**/*.html"

  lint:
    desc: "Check formatting and lint rules without modifying tracked files"
    cmds:
      - uvx ruff check .
      - uvx ruff format --check .
      - npx -y prettier@3.9.6 --check "src/webapp/templates/**/*.html"

  test:
    desc: "Run automated tests without modifying tracked files"
    cmds:
      - uv run pytest -q

  fixtures:update:
    desc: "Explicitly regenerate tracked expected offline-pipeline outputs"
    cmds:
      - uv run python tests/fixture_pipeline.py --update

  fixtures:check:
    desc: "Regenerate fixture pipeline in a temp directory and reject output drift"
    cmds:
      - uv run python tests/fixture_pipeline.py

  ci:
    desc: "Non-destructive CI contract: lint, tests, fixture replay, tracked-file diff audit"
    cmds:
      - task: lint
      - task: test
      - task: fixtures:check
      - git diff --exit-code -- .
