version: '3'

tasks:
  default:
    cmds:
      - task --list

  # ==================================================
  # USER STORY TASKS
  # ==================================================

  import:
    desc: "[1] データ取込: Import broker CSVs + download market data → unified dataset"
    cmds:
      - uv run python -m src.cli import {{.CLI_ARGS}}

  view:
    desc: "[2] ポートフォリオ確認: View current holdings and P&L"
    cmds:
      - uv run python -m src.cli view {{.CLI_ARGS}}

  analyze:
    desc: "[3] パフォーマンス分析: Analyze historical performance metrics"
    cmds:
      - uv run python -m src.cli analyze {{.CLI_ARGS}}

  report:
    desc: "[4] レポート出力: Generate charts and comprehensive reports"
    cmds:
      - uv run python -m src.cli report {{.CLI_ARGS}}

  pipeline:
    desc: "フルパイプライン: Run complete workflow (import → view → analyze → report)"
    cmds:
      - task: view
      - task: analyze
      - task: report

  # ==================================================
  # UTILITY TASKS
  # ==================================================

  clean:
    desc: Clean all artifacts (cache + data)
    deps: [clean:cache, clean:data]

  clean:cache:
    desc: Remove __pycache__ and .pyc files
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete

  clean:data:
    desc: "Remove generated data (Safe: keeps raw data)"
    cmds:
      - rm -rf data/interim data/unified data/reports data/processed data/output

  test:
    desc: Run tests and linting
    cmds:
      - uvx ruff check . --fix
      - uvx ruff format .

  serve:
    desc: "Web UI: Start FastAPI + htmx dashboard"
    cmds:
      - uv run uvicorn src.webapp.main:app --reload --host 0.0.0.0 --port 8000

