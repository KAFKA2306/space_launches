version: '3'

tasks:
  default:
    cmds:
      - task --list

  fetch:
    desc: "1. [Data Ingestion] Load raw broker CSVs, download market data, and build unified dataset"
    cmds:
      - uv run python -m src.cli fetch {{.CLI_ARGS}}

  run:
    desc: "2. [DEPRECATED] Use 'task portfolio'"
    cmds:
      - echo "⚠️  'task run' is deprecated. Using 'task portfolio'..."
      - task portfolio {{.CLI_ARGS}}
  
  portfolio:
    desc: "2. [Portfolio Report] Calculate P&L, holdings, and asset allocation (processed -> reports)"
    cmds:
      - uv run python -m src.cli portfolio {{.CLI_ARGS}}

  analyze:
    desc: "3. [DEPRECATED] Use 'task unified'"
    cmds:
      - echo "⚠️  'task analyze' is deprecated. Using 'task unified'..."
      - task unified {{.CLI_ARGS}}

  unified:
    desc: "3. [Deep Analysis] Analyze full trade history (Unified CSV) for advanced insights"
    cmds:
      - uv run python -m src.cli unified {{.CLI_ARGS}}

  all:
    desc: "Run complete pipeline: fetch → portfolio → unified"
    cmds:
      - task: fetch
      - task: portfolio
      - task: unified

  clean:
    desc: Clean all artifacts (cache + data)
    deps: [clean:cache, clean:data]

  clean:cache:
    desc: Remove __pycache__ and .pyc files
    cmds:
      - find . -type d -name "__pycache__" -exec rm -rf {} +
      - find . -type f -name "*.pyc" -delete

  clean:data:
    desc: "Remove generated data (Safe: keeps raw data)"
    cmds:
      - rm -rf data/interim data/unified data/reports data/processed data/output

  test:
    desc: Run tests and linting
    cmds:
      - uvx ruff check . --fix
      - uvx ruff format .
