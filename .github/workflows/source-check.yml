name: FAA commercial-space source check

on:
  pull_request:
    paths:
      - 'scripts/collect_faa_space.py'
      - 'data/faa-part450-transitions.json'
      - '.github/workflows/source-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile collector
        run: python -m py_compile scripts/collect_faa_space.py
      - name: Fetch current FAA commercial-space sources
        run: python scripts/collect_faa_space.py --output /tmp/faa-commercial-space.json
