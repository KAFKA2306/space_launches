name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose Ruff lint
        continue-on-error: true
        run: uvx ruff check .

      - name: Diagnose Ruff formatting
        continue-on-error: true
        run: uvx ruff format --check .

      - name: Diagnose Prettier formatting
        continue-on-error: true
        run: npx -y prettier@3.9.6 --check "src/webapp/templates/**/*.html"

      - name: Diagnose tests
        continue-on-error: true
        run: uv run pytest -q

      - name: Run non-destructive CI contract
        run: task ci
