name: FAA launch data probe

on:
  pull_request:
    paths:
      - .github/workflows/faa-launch-data-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe FAA DOT Tableau CSV exports
        run: |
          python - <<'PY'
          import urllib.request
          urls=[
              'https://explore.dot.gov/t/FAA/views/FAAFactBookCommercialSpaceTransportation/LicensedLaunches.csv?:showVizHome=no',
              'https://explore.dot.gov/t/FAA/views/CommercialSpaceTransportation_web/CommercialSpace_web.csv?:showVizHome=no',
              'https://explore.dot.gov/t/FAA/views/CommercialSpaceTransportation/Main.csv?:showVizHome=no',
          ]
          headers={
              'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36',
              'Accept':'text/csv,text/plain,*/*',
              'Accept-Encoding':'identity',
          }
          for url in urls:
              print('URL',url)
              try:
                  req=urllib.request.Request(url,headers=headers)
                  with urllib.request.urlopen(req,timeout=60) as r:
                      raw=r.read()
                      print('STATUS',r.status,'TYPE',r.headers.get_content_type(),'SIZE',len(raw))
                  text=raw.decode('utf-8',errors='replace')
                  print('HEAD',repr(text[:4000]))
                  for marker in ['Blue Origin','New Shepard','New Glenn','SpaceX','Rocket Lab','2026']:
                      print('MARKER',marker,marker.casefold() in text.casefold())
              except Exception as exc:
                  print('FAIL',type(exc).__name__,str(exc))
          PY
