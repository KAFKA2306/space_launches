name: Issue 1 fixture bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.pull_request.head.ref == 'agent/issue-1-fixture-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1-fixture-pipeline
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Generate expected fixture outputs
        run: uv run python tests/fixture_pipeline.py --update
      - name: Commit generated expectations
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/fixtures/expected
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "record deterministic fixture pipeline outputs"
          git push origin HEAD:agent/issue-1-fixture-pipeline
