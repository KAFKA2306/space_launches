name: Deploy Pages

on:
  pull_request:
    paths:
      - web/**
      - api/v1/space-launches/**
      - .github/workflows/pages.yml
  push:
    branches: [main]
    paths:
      - web/**
      - api/v1/space-launches/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate canonical launch boundaries
        run: |
          python -m json.tool api/v1/space-launches/index.json >/dev/null
          python -m json.tool api/v1/space-launches/launches.json >/dev/null
          python -m json.tool api/v1/space-launches/planned.json >/dev/null
          python -m json.tool api/v1/space-launches/reuse-events.json >/dev/null
          python -m json.tool api/v1/space-launches/monthly-cadence.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('api/v1/space-launches')
          index=json.loads((root/'index.json').read_text())
          launches=json.loads((root/'launches.json').read_text())['records']
          planned=json.loads((root/'planned.json').read_text())['records']
          reuse=json.loads((root/'reuse-events.json').read_text())['records']
          cadence=json.loads((root/'monthly-cadence.json').read_text())['records']
          assert launches and planned and cadence
          assert all(r['mission_state']=='completed' for r in launches)
          assert all(r['mission_state']=='planned' for r in planned)
          assert index['coverage']['completed_launch_count']==len(launches)
          assert index['coverage']['reuse_event_count']==len(reuse)
          assert max(r['launch_date'] for r in launches)==index['coverage']['last_launch_date']
          assert any(r.get('source_verification_mode')=='reviewed_primary_url' for r in reuse)
          assert any(r.get('source_verification_mode')=='live_fetched_primary' for r in launches)
          html=Path('web/index.html').read_text()
          for marker in ('id="mission"','id="seven"','id="thirty"','id="ytd"','id="cadence"','id="planned"','id="error"','source_verification_mode'):
              assert marker in html, marker
          for marker in ('最後に完了した打上げ','確認済みの予定','完了した打上げのみ','正準データの取得に失敗しました'):
              assert marker in html, marker
          start=html.index('<script type="module">')+len('<script type="module">')
          end=html.index('</script>',start)
          Path('/tmp/dashboard.mjs').write_text(html[start:end])
          PY
          node --check /tmp/dashboard.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Pages artifact from canonical API
        run: |
          mkdir -p web/api/v1
          rm -rf web/api/v1/space-launches
          cp -R api/v1/space-launches web/api/v1/space-launches
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('web/deployment.json').write_text(json.dumps({'source_commit':os.environ['GITHUB_SHA']},indent=2)+'\n')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact deployed revision and canonical surface
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, time
          from urllib.parse import urljoin
          from urllib.request import urlopen
          base=os.environ['PAGE_URL']; expected=os.environ['GITHUB_SHA']; last=None
          for _ in range(30):
              try:
                  with urlopen(urljoin(base,'deployment.json'),timeout=10) as r: dep=json.load(r)
                  with urlopen(urljoin(base,'api/v1/space-launches/index.json'),timeout=10) as r: idx=json.load(r)
                  with urlopen(base,timeout=10) as r: html=r.read().decode()
                  assert dep['source_commit']==expected
                  assert idx['coverage']['completed_launch_count']>0
                  assert '最後に何が宇宙へ上がった' in html
                  assert '確認済みの予定' in html
                  assert 'id="error"' in html
                  print({'page_url':base,'source_commit':expected,'last_launch_date':idx['coverage']['last_launch_date']})
                  break
              except Exception as exc:
                  last=exc; time.sleep(2)
          else:
              raise SystemExit(f'production verification failed: {last}')
          PY
