name: SpaceX route probe

on:
  pull_request:
    paths:
      - .github/workflows/spacex-route-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect SpaceX official launch JSON schema
        run: |
          python - <<'PY'
          import json
          import urllib.request

          headers={
              'User-Agent':'KAFKA2306 space-launches evidence 137051370+KAFKA2306@users.noreply.github.com',
              'Accept':'application/json',
              'Origin':'https://www.spacex.com',
              'Referer':'https://www.spacex.com/',
              'Accept-Encoding':'identity',
          }
          for url in [
              'https://content.spacex.com/api/spacex-website/launches-page-tiles',
              'https://content.spacex.com/api/spacex-website/launches-page-tiles/upcoming',
          ]:
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
              payload=json.loads(raw)
              print('URL',url,'TYPE',type(payload).__name__,'COUNT',len(payload) if hasattr(payload,'__len__') else None,'SIZE',len(raw))
              if isinstance(payload,list):
                  for row in payload[:2] + payload[-2:]:
                      print(json.dumps(row,ensure_ascii=False,sort_keys=True)[:4000])
              elif isinstance(payload,dict):
                  print('KEYS',sorted(payload))
                  print(json.dumps(payload,ensure_ascii=False,sort_keys=True)[:8000])
          PY
