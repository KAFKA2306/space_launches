name: SpaceX route probe

on:
  pull_request:
    paths:
      - .github/workflows/spacex-route-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Probe official SpaceX launch routes
        run: |
          python - <<'PY'
          import urllib.request
          urls = [
              'https://www.spacex.com/launches/',
              'https://www.spacex.com/launches/mission-history/',
              'https://www.spacex.com/launches/?os=___',
          ]
          for url in urls:
              req = urllib.request.Request(url, headers={'User-Agent':'KAFKA2306 space-launches evidence 137051370+KAFKA2306@users.noreply.github.com','Accept-Encoding':'identity'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read()
              text = raw.decode('utf-8', errors='replace')
              print('URL', url)
              print('SIZE', len(raw), 'TR', text.lower().count('<tr'), 'TD', text.lower().count('<td'))
              for marker in ['Completed missions','Falcon 9','Launch site','2026','SLC-40']:
                  print('MARKER', marker, marker.casefold() in text.casefold())
              idx = text.casefold().find('completed')
              print('SNIP', text[max(0, idx-150):idx+500] if idx >= 0 else text[:500])
          PY
