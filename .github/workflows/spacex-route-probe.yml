name: SpaceX route probe

on:
  pull_request:
    paths:
      - .github/workflows/spacex-route-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect SpaceX mission service context
        run: |
          python - <<'PY'
          import urllib.request
          url='https://www.spacex.com/main.8cc27b3a18b8afe1.js'
          headers={'User-Agent':'KAFKA2306 space-launches evidence 137051370+KAFKA2306@users.noreply.github.com','Accept-Encoding':'identity'}
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req,timeout=30) as r:
              text=r.read().decode('utf-8',errors='replace')
          for needle in ['launches-page-tiles','getUpcomingMissions','getCompletedMissions','launches-page-stats','getMissions']:
              start=0
              print('===',needle,'===')
              while True:
                  idx=text.find(needle,start)
                  if idx < 0: break
                  print(text[max(0,idx-700):idx+1200])
                  start=idx+len(needle)
          PY
