name: SpaceX route probe

on:
  pull_request:
    paths:
      - .github/workflows/spacex-route-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect compact SpaceX CMS mission schema
        run: |
          python - <<'PY'
          import json
          import urllib.request

          headers={
              'User-Agent':'KAFKA2306 space-launches evidence 137051370+KAFKA2306@users.noreply.github.com',
              'Accept':'application/json',
              'Origin':'https://www.spacex.com',
              'Referer':'https://www.spacex.com/',
              'Accept-Encoding':'identity',
          }
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read())

          tiles=get('https://content.spacex.com/api/spacex-website/launches-page-tiles')
          print('TILE_COUNT',len(tiles))
          print('TILE_KEYS',sorted(tiles[0]))
          scalar=lambda row:{k:v for k,v in row.items() if not isinstance(v,(dict,list))}
          finals=[row for row in tiles if row.get('missionStatus')=='final']
          print('FINAL_COUNT',len(finals))
          for row in (finals[:2]+finals[-5:]):
              print('FINAL_SCALAR',json.dumps(scalar(row),ensure_ascii=False,sort_keys=True))

          mission=get('https://content.spacex.com/api/spacex-website/missions/sl-6-59')
          print('MISSION_TYPE',type(mission).__name__)
          if isinstance(mission,dict):
              print('MISSION_KEYS',sorted(mission))
              print('MISSION_SCALAR',json.dumps(scalar(mission),ensure_ascii=False,sort_keys=True))
              text=json.dumps(mission,ensure_ascii=False)
              for marker in ['May 17, 2024','21st flight','Falcon 9','Starlink 6-59']:
                  print('MISSION_MARKER',marker,marker.casefold() in text.casefold())
          PY
