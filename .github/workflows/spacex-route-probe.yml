name: SpaceX route probe

on:
  pull_request:
    paths:
      - .github/workflows/spacex-route-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Inspect official SpaceX frontend bundles
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request

          root = 'https://www.spacex.com/launches/'
          headers = {'User-Agent':'KAFKA2306 space-launches evidence 137051370+KAFKA2306@users.noreply.github.com','Accept-Encoding':'identity'}
          req = urllib.request.Request(root, headers=headers)
          with urllib.request.urlopen(req, timeout=30) as r:
              html = r.read().decode('utf-8', errors='replace')
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)
          print('SCRIPTS', scripts)
          for src in scripts:
              url = urllib.parse.urljoin(root, src)
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                  text = raw.decode('utf-8', errors='replace')
                  print('BUNDLE', url, 'SIZE', len(raw))
                  patterns = [
                      r'https?://[^"\' ]+',
                      r'/api/[^"\' ]+',
                      r'graphql[^"\' ]*',
                      r'mission[-_A-Za-z]*history[^"\' ]*',
                      r'launch(?:es)?[^"\' ]{0,120}',
                  ]
                  hits = []
                  for pattern in patterns:
                      for match in re.findall(pattern, text, re.I):
                          value = match if isinstance(match, str) else ''.join(match)
                          if value not in hits:
                              hits.append(value)
                  for hit in hits[:80]:
                      print('HIT', hit[:500])
              except Exception as exc:
                  print('BUNDLE_FAIL', url, type(exc).__name__, str(exc))
          PY
