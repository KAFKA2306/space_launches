{% if has_data %}
<div class="chart-container"
    style="padding: 1rem; background: var(--bg-dark); border-radius: 0.5rem; margin: 0.5rem 0;">
    <canvas id="chart-{{ symbol | replace('.', '-') }}" height="150"></canvas>
</div>
<script>
    (function () {
        const ctx = document.getElementById('chart-{{ symbol | replace('.', ' - ') }}').getContext('2d');
        const data = {{ chart_data | safe
    }};

    const labels = data.map(d => d.date);
    const prices = data.map(d => d.price);

    const minPrice = Math.min(...prices);
    const maxPrice = Math.max(...prices);
    const priceChange = prices.length > 1 ? prices[prices.length - 1] - prices[0] : 0;
    const lineColor = priceChange >= 0 ? '#22c55e' : '#ef4444';

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels,
            datasets: [{
                label: '{{ symbol }}',
                data: prices,
                borderColor: lineColor,
                backgroundColor: lineColor + '20',
                fill: true,
                tension: 0.3,
                pointRadius: 0,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                tooltip: {
                    mode: 'index',
                    intersect: false,
                    backgroundColor: '#1e293b',
                    titleColor: '#f1f5f9',
                    bodyColor: '#94a3b8',
                    borderColor: '#334155',
                    borderWidth: 1
                }
            },
            scales: {
                x: {
                    display: true,
                    grid: { color: '#334155' },
                    ticks: {
                        color: '#94a3b8',
                        maxTicksLimit: 6,
                        font: { size: 10 }
                    }
                },
                y: {
                    display: true,
                    grid: { color: '#334155' },
                    ticks: {
                        color: '#94a3b8',
                        font: { size: 10 }
                    },
                    suggestedMin: minPrice * 0.98,
                    suggestedMax: maxPrice * 1.02
                }
            },
            interaction: {
                mode: 'nearest',
                axis: 'x',
                intersect: false
            }
        }
    });
}) ();
</script>
{% else %}
<div style="padding: 1rem; text-align: center; color: var(--text-secondary);">
    <span>📈 No chart data available for {{ symbol }}</span>
</div>
{% endif %}
