{% if success %}
<div
  style="
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid var(--positive);
    color: var(--positive);
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    margin-bottom: 1rem;
  "
>
  ✅ {{ message }}
</div>
{% else %}
<div
  style="
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid var(--negative);
    color: var(--negative);
    padding: 0.75rem 1rem;
    border-radius: 0.5rem;
    margin-bottom: 1rem;
  "
>
  ❌ {{ message }}
</div>
{% endif %}
