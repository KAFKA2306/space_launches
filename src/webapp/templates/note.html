{% extends "base.html" %} {% block title %}Note: {{ symbol }}{% endblock %} {%
block content %}
<div class="container">
  <header>
    <div class="header-left">
      <a
        href="/"
        class="btn btn-secondary"
        style="
          margin-right: 1rem;
          text-decoration: none;
          color: var(--text-secondary);
        "
        >&larr; Dashboard</a
      >
      <h1>{{ symbol }} Trade Note</h1>
    </div>
  </header>

  <div class="card">
    <div class="markdown-body">{{ content | safe }}</div>
  </div>
</div>

<style>
  /* Basic Markdown Styles matching the dark theme */
  .markdown-body {
    color: var(--text-primary);
    line-height: 1.6;
  }

  .markdown-body h1,
  .markdown-body h2,
  .markdown-body h3 {
    color: var(--text-primary);
    margin-top: 1.5rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
  }

  .markdown-body p {
    margin-bottom: 1rem;
  }

  .markdown-body ul,
  .markdown-body ol {
    padding-left: 2rem;
    margin-bottom: 1rem;
  }

  .markdown-body table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 1.5rem;
    background: var(--bg-dark);
    border-radius: 0.5rem;
    overflow: hidden;
  }

  .markdown-body th,
  .markdown-body td {
    padding: 0.75rem 1rem;
    border-bottom: 1px solid var(--border);
    text-align: left;
  }

  .markdown-body th {
    background: var(--bg-hover);
    color: var(--text-secondary);
    font-weight: 600;
  }

  .markdown-body tr:hover {
    background: var(--bg-hover);
  }

  .markdown-body code {
    background: var(--bg-dark);
    padding: 0.2rem 0.4rem;
    border-radius: 0.25rem;
    font-family: monospace;
    font-size: 0.9em;
  }

  .markdown-body blockquote {
    border-left: 4px solid var(--accent);
    padding-left: 1rem;
    color: var(--text-secondary);
    margin-top: 1rem;
    margin-bottom: 1rem;
  }

  /* Strong highlighting for PnL */
  .markdown-body strong {
    color: var(--positive);
    /* default to green consideration, or keep white */
    font-weight: 700;
  }
</style>
{% endblock %}
